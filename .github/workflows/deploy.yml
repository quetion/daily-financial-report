name: Deploy Daily Report to GitHub Pages

on:
  schedule:
    - cron: '40 22 * * *'   # 台灣時間每天 06:40
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest report from Google Drive
        env:
          FILE_ID: 1cWdj2UGH0X6vhdZ6JZ0Up4ryjqjhIitH
        run: |
          set -e
          mkdir -p _site

          # 直接用 curl 打 Google Drive 的公開下載端點，不再依賴 gdown
          curl -sSL -c cookies.txt \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
            -o _site/index.html

          # 檔案較大時 Google 會先回傳一個「病毒掃描警告」頁面，裡面藏著真正的確認連結（confirm token）
          if grep -q "confirm=" _site/index.html 2>/dev/null; then
            CONFIRM_URL=$(grep -o 'href="[^"]*confirm=[^"]*"' _site/index.html | head -1 | sed 's/href="//;s/"$//' | sed 's/&amp;/\&/g')
            if [ -n "$CONFIRM_URL" ]; then
              curl -sSL -b cookies.txt "https://drive.google.com${CONFIRM_URL}" -o _site/index.html
            fi
          fi

      - name: Verify downloaded file
        run: |
          set -e
          test -s _site/index.html || { echo "::error::下載檔案為空"; exit 1; }
          SIZE=$(stat -c%s _site/index.html)
          echo "下載大小: ${SIZE} bytes"
          # 權限不足 / 配額超限時，Google 會回傳一頁很小的 HTML 錯誤頁
          if [ "$SIZE" -lt 2000 ]; then
            echo "::error::檔案過小，可能抓到 Google Drive 的錯誤頁面"
            head -c 500 _site/index.html
            exit 1
          fi
          if grep -qi "Google Drive - Quota exceeded\|Sign in - Google Accounts\|需要存取權\|accounts.google.com" _site/index.html; then
            echo "::error::抓到 Google 權限/配額頁面，請確認檔案已設為「知道連結的任何人」"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
