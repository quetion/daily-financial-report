name: Deploy Daily Report to GitHub Pages

on:
  schedule:
    - cron: '40 22 * * *'  # 每天台灣時間早上 06:40 自動執行
  workflow_dispatch:        # 支援手動按鈕執行

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Latest Report from Google Drive
        run: |
          pip install gdown
          gdown --id "1TAHe97Io5ESTYi2lxQWFkuJ5QqrO2uxk" -O index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
